[package]
name = "backend"
version = "1.2.2"
edition = "2024"

[[bin]]
name = "CourSys"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-recursion = "1.1.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
brotli = "8.0.4"
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
futures = "0.3.33"
itertools = "0.15.0"
mime_guess = "2.0.5"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "cookies", "form", "stream"] }
rfd = "0.17.2"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.36.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs"] }
tower-http = { version = "0.7.0", features = ["compression-full", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
uuid = { version = "1.24.0", features = ["v4"] }
webbrowser = "1.2.4"
wry = "0.56.0"
